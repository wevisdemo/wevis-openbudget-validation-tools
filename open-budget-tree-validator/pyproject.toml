[project]
name = "open_budget_tree_validator"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas", "numpy", "levenshtein"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true